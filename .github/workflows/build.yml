name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build self-contained exe
        shell: pwsh
        run: |
          .\build.ps1
          if (-not (Test-Path SettVPN.exe)) { throw "Build failed: SettVPN.exe not found" }

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path SettVPN.exe -DestinationPath SettVPN.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SettVPN
          path: |
            SettVPN.exe
            SettVPN.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" SettVPN.exe SettVPN.zip --title "SETT VPN ${{ github.ref_name }}"
